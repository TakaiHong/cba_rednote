name = "ntu-cba-content-api"
main = "src/index.ts"
compatibility_date = "2026-07-29"

# 09:15 Singapore time (01:15 UTC): create one draft for human review.
[triggers]
crons = ["15 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ntu-cba-content-db"
database_id = "09211257-18c2-43cf-96a0-eb74226f9996"

[vars]
FIREBASE_PROJECT_ID = "ntu-cba-rednote"
DEEPSEEK_MODEL = "deepseek-chat"
MAX_COST_CNY_PER_POST = "0.5"
ALLOWED_ORIGIN = "https://ntu-cba-rednote.web.app"
