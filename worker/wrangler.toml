name = "ntu-cba-rednote-api"
main = "src/index.ts"
compatibility_date = "2026-07-29"

# 09:15 Singapore time (01:15 UTC): create one draft for human review.
[triggers]
crons = ["15 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ntu-cba-rednote"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
DEEPSEEK_MODEL = "deepseek-chat"
MAX_COST_CNY_PER_POST = "0.5"
# The Hosting URL is set during deployment, e.g. https://your-project.web.app
ALLOWED_ORIGIN = "REPLACE_WITH_FIREBASE_HOSTING_ORIGIN"
